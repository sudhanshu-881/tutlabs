name: E2E

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run build
      - run: npx serve -s dist -l 3000 &
      - run: npx wait-on http://localhost:3000
      - run: npm run test:e2e
