<!DOCTYPE html>
<html>
<head>
    <title>Test Environment Variables</title>
</head>
<body>
    <h1>Environment Variables Test</h1>
    <div id="output"></div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        try {
            // Test if we can access environment variables
            const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
            const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
            const contactEmail = import.meta.env.VITE_CONTACT_EMAIL;
            
            output.innerHTML = `
                <p><strong>VITE_SUPABASE_URL:</strong> ${supabaseUrl || 'undefined'}</p>
                <p><strong>VITE_SUPABASE_ANON_KEY:</strong> ${supabaseKey ? 'Set' : 'Not set'}</p>
                <p><strong>VITE_CONTACT_EMAIL:</strong> ${contactEmail || 'undefined'}</p>
                <p><strong>NODE_ENV:</strong> ${import.meta.env.NODE_ENV || 'undefined'}</p>
                <p><strong>MODE:</strong> ${import.meta.env.MODE || 'undefined'}</p>
            `;
            
            // Test if we can create a Supabase client
            if (supabaseUrl && supabaseKey) {
                try {
                    const { createClient } = await import('@supabase/supabase-js');
                    const supabase = createClient(supabaseUrl, supabaseKey);
                    output.innerHTML += '<p style="color: green;">✅ Supabase client created successfully!</p>';
                } catch (error) {
                    output.innerHTML += `<p style="color: red;">❌ Error creating Supabase client: ${error.message}</p>`;
                }
            } else {
                output.innerHTML += '<p style="color: red;">❌ Missing Supabase credentials</p>';
            }
        } catch (error) {
            output.innerHTML += `<p style="color: red;">❌ Error: ${error.message}</p>`;
        }
    </script>
</body>
</html>
