<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Screen Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .debug-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(34, 197, 94, 0.3); border: 1px solid #22c55e; }
        .error { background: rgba(239, 68, 68, 0.3); border: 1px solid #ef4444; }
        .info { background: rgba(59, 130, 246, 0.3); border: 1px solid #3b82f6; }
        .warning { background: rgba(245, 158, 11, 0.3); border: 1px solid #f59e0b; }
        #debug-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔧 Blank Screen Debug Test</h1>
        
        <div id="status-container">
            <div class="status success">✅ Server is running on port 3000</div>
            <div class="status info">🔍 Debugging blank screen issue...</div>
        </div>
        
        <div id="debug-info">
            <h3>Debug Information:</h3>
            <div id="console-logs"></div>
            <div id="react-status"></div>
            <div id="loading-status"></div>
        </div>
        
        <div id="root">
            <div class="status error">❌ React app not loaded - blank screen detected</div>
        </div>
        
        <script>
            console.log('🔧 Debug: Blank screen test starting...');
            
            // Capture console logs
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            
            const logs = [];
            
            console.log = function(...args) {
                logs.push('LOG: ' + args.join(' '));
                originalLog.apply(console, args);
            };
            
            console.error = function(...args) {
                logs.push('ERROR: ' + args.join(' '));
                originalError.apply(console, args);
            };
            
            console.warn = function(...args) {
                logs.push('WARN: ' + args.join(' '));
                originalWarn.apply(console, args);
            };
            
            // Check React loading
            setTimeout(() => {
                const rootElement = document.getElementById('root');
                const consoleLogs = document.getElementById('console-logs');
                const reactStatus = document.getElementById('react-status');
                const loadingStatus = document.getElementById('loading-status');
                
                // Display console logs
                consoleLogs.innerHTML = '<strong>Console Logs:</strong><br>' + logs.join('<br>');
                
                // Check React status
                if (typeof React !== 'undefined') {
                    reactStatus.innerHTML = '<div class="status success">✅ React is loaded</div>';
                } else {
                    reactStatus.innerHTML = '<div class="status error">❌ React is not loaded</div>';
                }
                
                // Check loading status
                if (rootElement && rootElement.innerHTML.includes('blank screen detected')) {
                    loadingStatus.innerHTML = '<div class="status error">❌ App is stuck in loading state or not rendering</div>';
                } else {
                    loadingStatus.innerHTML = '<div class="status success">✅ App is rendering content</div>';
                }
                
            }, 10000);
        </script>
        
        <script type="module" src="http://localhost:3000/index.tsx"></script>
    </div>
</body>
</html>
