<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Minimal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: rgba(34, 197, 94, 0.3); border: 1px solid #22c55e; }
        .error { background: rgba(239, 68, 68, 0.3); border: 1px solid #ef4444; }
        .warning { background: rgba(245, 158, 11, 0.3); border: 1px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 TutLabs Debug Test</h1>
        <p>If you can see this page, the server is working correctly.</p>
        
        <div id="status-container">
            <div class="status success">✅ Server is running on port 3000</div>
            <div class="status warning">⚠️ Testing React app loading...</div>
        </div>
        
        <div id="root"></div>
        
        <script>
            console.log('🔧 Debug: HTML loaded successfully');
            
            // Test if we can access the main app
            fetch('/')
                .then(response => {
                    console.log('✅ Debug: Server response:', response.status);
                    if (response.ok) {
                        document.getElementById('status-container').innerHTML += 
                            '<div class="status success">✅ Server responding correctly</div>';
                    } else {
                        document.getElementById('status-container').innerHTML += 
                            '<div class="status error">❌ Server error: ' + response.status + '</div>';
                    }
                })
                .catch(error => {
                    console.error('❌ Debug: Server error:', error);
                    document.getElementById('status-container').innerHTML += 
                        '<div class="status error">❌ Cannot connect to server: ' + error.message + '</div>';
                });
        </script>
        
        <script type="module" src="/index.tsx"></script>
    </div>
</body>
</html>
